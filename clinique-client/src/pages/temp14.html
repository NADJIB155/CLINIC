<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HealthSync - Verify Your Identity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Public Sans", sans-serif;
        }
        /* Remove arrows from number input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display text-slate-900 dark:text-slate-100 p-4">
<div class="max-w-md w-full">
<!-- Main Card -->
<div class="bg-white dark:bg-slate-900 shadow-xl rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Header/Icon Section -->
<div class="pt-10 pb-6 flex flex-col items-center">
<div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-4xl">shield_lock</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Verify Your Identity</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm text-center px-8">
                    We've sent a 6-digit code to your registered email address <span class="font-medium text-slate-700 dark:text-slate-200">m***@healthsync.com</span>
</p>
</div>
<!-- OTP Input Section -->
<div class="px-8 py-4">
<form action="#" method="POST">
<div class="flex justify-between gap-2 mb-8">
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
<input class="w-12 h-14 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-700 rounded-lg focus:border-primary focus:ring-0 bg-transparent" maxlength="1" placeholder="·" type="number"/>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-lg transition-colors duration-200 shadow-lg shadow-primary/20 flex items-center justify-center gap-2" type="submit">
                        Verify
                        <span class="material-symbols-outlined text-base">arrow_forward</span>
</button>
</form>
<!-- Resend & Back Actions -->
<div class="mt-8 flex flex-col items-center gap-4 border-t border-slate-100 dark:border-slate-800 pt-6">
<div class="text-sm">
<span class="text-slate-500 dark:text-slate-400">Didn't receive the code?</span>
<button class="text-primary font-semibold hover:underline ml-1">Resend Code</button>
</div>
<button class="flex items-center gap-2 text-sm text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-sm">keyboard_backspace</span>
                        Back to Login
                    </button>
</div>
</div>
<!-- Trust Footer -->
<div class="bg-slate-50 dark:bg-slate-800/50 py-4 px-8 flex justify-center items-center gap-4">
<div class="flex items-center gap-1.5 opacity-70">
<span class="material-symbols-outlined text-sm text-slate-600 dark:text-slate-400">lock</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">Secure HIPAA Compliant</span>
</div>
<div class="w-px h-3 bg-slate-300 dark:bg-slate-600"></div>
<div class="flex items-center gap-1.5 opacity-70">
<span class="material-symbols-outlined text-sm text-slate-600 dark:text-slate-400">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400">256-bit AES Encrypted</span>
</div>
</div>
</div>
<!-- App Branding -->
<div class="mt-8 flex justify-center items-center gap-2 opacity-50">
<svg class="w-6 h-6 text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M47.2426 24L24 47.2426L0.757355 24L24 0.757355L47.2426 24ZM12.2426 21H35.7574L24 9.24264L12.2426 21Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
<span class="font-bold text-lg tracking-tight">HealthSync</span>
</div>
</div>
</body></html>
